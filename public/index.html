<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tactical Strike - Akshay</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Game HUD -->
    <div id="hud">
        <div id="crosshair">+</div>
        <div id="stats">
            <div>SCORE: <span id="score">0</span></div>
            <div>AMMO: <span id="ammo">30</span>/30</div>
        </div>
    </div>
    
    <!-- Mobile On-Screen Controls -->
    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <button id="shoot-btn">FIRE</button>
    </div>

    <!-- App Loading & Start Screen -->
    <div id="blocker">
        <div id="menu-box">
            <h1>TACTICAL STRIKE</h1>
            <p class="subtitle">Designed by Akshay</p>
            
            <div id="loading-container">
                <div id="loading-bar"></div>
            </div>
            <p id="loading-text">Loading Assets...</p>

            <button id="play-btn" style="display: none;">TAP TO PLAY</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
